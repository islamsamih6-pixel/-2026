<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُتْقِن — مقيّم تلاوة جزء عمّ</title>
<meta name="description" content="تطبيق تعليمي لتدريب الطالبات على تسميع جزء عمّ — إعداد اسلام عواودة — رخصة المشاع الإبداعي CC BY-NC-SA 4.0">
<meta name="author" content="اسلام عواودة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Cairo",system-ui,sans-serif;
    background-color:#faf6ee;color:#24312a;
    background-image:radial-gradient(1100px 500px at 50% -120px,#f3ecda 0%,transparent 70%);
    background-repeat:no-repeat;
    min-height:100vh;display:flex;flex-direction:column;line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  a{color:inherit}
  svg{flex-shrink:0}

  /* ---------- app chrome ---------- */
  .app-header{
    background:linear-gradient(135deg,#163b2e 0%,#1e4d3b 55%,#2e6b54 100%);
    border-bottom:2px solid #c9a227;
    box-shadow:0 2px 10px rgb(30 77 59 / .25);
    position:sticky;top:0;z-index:40;
  }
  .app-header .brand{display:flex;width:100%;max-width:56rem;margin-inline:auto;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1rem}
  .brand-icon{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.75rem;background:rgb(255 255 255 / .1)}
  .brand-text{text-align:right}
  .brand-text b{display:block;font-size:1.125rem;line-height:1.25;color:#fff}
  .brand-text small{display:block;font-size:11px;line-height:1rem;color:rgb(255 255 255 / .7)}
  .app-footer{background:linear-gradient(135deg,#163b2e 0%,#1e4d3b 100%);padding:12px 16px 14px;margin-top:auto}
  .app-footer p{text-align:center;font-size:12px;color:rgb(255 255 255 / .6)}
  .app-footer p+p{margin-top:6px}
  .app-footer p.copy{color:rgb(255 255 255 / .5)}
  .app-footer a{color:rgb(255 255 255 / .5);text-decoration:underline;text-decoration-color:rgb(255 255 255 / .4);text-underline-offset:4px;transition:color .2s}
  .app-footer a:hover{color:#fff}
  main{flex:1}
  .container{max-width:56rem;margin-inline:auto;padding-inline:1rem;padding-bottom:2.5rem;width:100%}

  /* ---------- typography ---------- */
  .font-quran{font-family:"Amiri Quran","Amiri Quran",serif}

  .ayah-num{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:1.5em;height:1.5em;padding:0 .15em;margin:0 .15em;
    border:1.5px solid #c9a227;border-radius:50%;color:#8a6d1a;
    font-size:.55em;font-family:"Cairo",sans-serif;vertical-align:middle;background:#fdfaf2;
  }

  /* ---------- cards & sections ---------- */
  .card{border:1px solid #e6decb;background:#fff;border-radius:1rem;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
  .card-p{padding:1.25rem}
  .section-title{font-size:.875rem;font-weight:700;color:#6e7b72}

  .hero{
    margin-top:1rem;border:1px solid #e6decb;border-radius:1.5rem;
    background:linear-gradient(to bottom,#fff,#f7f2e6);
    padding:1.5rem;text-align:center;box-shadow:0 1px 2px rgb(0 0 0 / .05);
    position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;inset-inline-start:-60px;top:-60px;width:180px;height:180px;background:radial-gradient(circle,rgb(201 162 39 / .18),transparent 70%);pointer-events:none}
  @media(min-width:640px){.hero{padding:2rem}}
  .hero-ayah{font-size:1.125rem;color:#8a6d1a}
  .hero h1{margin-top:.5rem;font-size:1.5rem;font-weight:700;color:#1e4d3b}
  @media(min-width:640px){.hero h1{font-size:1.875rem}}
  .hero-sub{margin:.5rem auto 0;max-width:36rem;font-size:.875rem;line-height:1.5rem;color:#6e7b72}
  .chips{margin-top:1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem}
  .chip{display:inline-flex;align-items:center;gap:.375rem;border:1px solid #e6decb;background:#fff;border-radius:9999px;padding:.375rem .75rem;font-size:12px;color:#6e7b72}
  .chip b{color:#1e4d3b}
  .chip.clickable{font-weight:600;color:#1e4d3b;transition:background-color .2s}
  .chip.clickable:hover{background:#eef5f0}
  .chip .gold{color:#c9a227}
  .badges-row{margin-top:.75rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.375rem}
  .badge-pill{display:inline-flex;align-items:center;gap:.25rem;border-radius:9999px;background:#f5ebd0;padding:.25rem .625rem;font-size:11px;font-weight:600;color:#8a6d1a}

  /* ---------- profile card ---------- */
  .profile-head{margin-bottom:.75rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
  .profile-head h2{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:700;color:#1e4d3b}
  .saved-hint{display:flex;align-items:center;gap:.25rem;font-size:11px;color:#6e7b72}
  .saved-hint.active{color:#1e4d3b}
  .grid2{display:grid;gap:.75rem}
  @media(min-width:640px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .field-label{display:block;margin-bottom:.375rem;font-size:12px;font-weight:600;color:#24312a}
  .field-label .cap{display:inline-flex;align-items:center;gap:.375rem;color:#8a6d1a}
  .input{
    width:100%;border:1px solid #e6decb;background:#fbf8f1;border-radius:.75rem;
    padding:.625rem .875rem;font-size:.875rem;color:#24312a;box-shadow:0 1px 2px rgb(0 0 0 / .05);
    outline:none;transition:border-color .2s,background-color .2s;
  }
  .input::placeholder{color:#9aa69e}
  .input:focus{border-color:#c9a227;background:#fff}
  .search-wrap{position:relative;margin-top:1.25rem}
  .search-wrap .input{padding-inline-start:2.5rem;padding-inline-end:1rem;background:#fff}
  .search-wrap svg{position:absolute;right:.875rem;top:50%;transform:translateY(-50%);color:#6e7b72}

  /* ---------- surah grid ---------- */
  .grid-surahs{margin-top:1rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
  @media(min-width:640px){.grid-surahs{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:1024px){.grid-surahs{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .surah-card{
    position:relative;display:flex;flex-direction:column;align-items:center;
    border:1px solid #e6decb;background:#fff;border-radius:1rem;padding:1rem;text-align:center;
    box-shadow:0 1px 2px rgb(0 0 0 / .05);transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .surah-card:hover{transform:translateY(-2px);border-color:#c9a227;box-shadow:0 4px 6px rgb(0 0 0 / .07)}
  .surah-card h3{margin-top:.625rem;font-size:1.25rem;font-weight:700;color:#24312a}
  .surah-card:hover h3{color:#1e4d3b}
  .surah-meta{margin-top:.25rem;display:flex;align-items:center;gap:.5rem;font-size:11px;color:#6e7b72}
  .surah-meta span{display:inline-flex;align-items:center;gap:.125rem}
  .score-pill{margin-top:.5rem;border-radius:9999px;padding:.125rem .5rem;font-size:11px;font-weight:700}
  .score-pill.mastered{background:#e2f0e8;color:#1e4d3b}
  .score-pill.tried{background:#f5ebd0;color:#8a6d1a}
  .score-pill.new{background:#f2ede1;color:#6e7b72;font-weight:400}
  .empty-note{margin-top:2rem;text-align:center;font-size:.875rem;color:#6e7b72}

  .star-badge{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:linear-gradient(135deg,#1e4d3b,#2e6b54);
    clip-path:polygon(50% 0%,63% 12%,80% 8%,85% 25%,100% 37%,92% 50%,100% 63%,85% 75%,80% 92%,63% 88%,50% 100%,37% 88%,20% 92%,15% 75%,0% 63%,8% 50%,0% 37%,15% 25%,20% 8%,37% 12%)}
  .star-num{color:#e7ce7b;font-size:14px;font-weight:700}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:.375rem;border-radius:.75rem;padding:.5rem 1rem;font-size:.875rem;font-weight:600;border:1px solid #e6decb;background:#fff;color:#1e4d3b;transition:background-color .2s,box-shadow .2s}
  .btn:hover{background:#eef5f0}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-sm{padding:.375rem .75rem;font-size:12px;border-radius:9999px}
  .btn-primary{background:#1e4d3b;color:#fff;border-color:#1e4d3b}
  .btn-primary:hover{background:#163b2e}
  .btn-gold{background:#c9a227;color:#fff;border-color:#c9a227;font-weight:700}
  .btn-gold:hover{background:#b08e1f}
  .btn-destructive{background:#b3261e;color:#fff;border-color:#b3261e}
  .btn-destructive:hover{background:#992019}
  .btn-ghost{border-color:transparent;background:transparent;color:#6e7b72}
  .btn-ghost:hover{background:#f2ede1}
  .btn-ghost.danger{color:#b3261e}

  /* ---------- recite view ---------- */
  .topbar{display:flex;align-items:center;gap:.75rem;padding:1rem 0}
  .topbar-center{min-width:0;flex:1;text-align:center}
  .topbar-center h1{font-size:1.5rem;font-weight:700;color:#1e4d3b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-center p{font-size:12px;color:#6e7b72}
  .topbar-spacer{width:72px}
  .ref-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
  .ref-title{display:flex;align-items:center;gap:.5rem}
  .ref-icon{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:9999px;background:#f5ebd0}
  .ref-title h2{font-size:.875rem;font-weight:700;color:#24312a}
  .ref-title p{font-size:12px;color:#6e7b72}
  .ref-actions{display:flex;align-items:center;gap:.5rem}
  .envelope{margin-top:.75rem;display:flex;align-items:flex-end;gap:2px;overflow:hidden;height:40px}
  .envelope i{display:block;width:3px;border-radius:2px}
  .ayah-box{margin-top:1rem}
  .ayah-scroll{max-height:18rem;overflow-y:auto;border-radius:.75rem;background:#fbf8f1;padding:1rem;scrollbar-width:thin}
  .ayah-text{font-size:1.5rem;line-height:2.4;color:#24312a}
  .bismillah{margin-bottom:1rem;text-align:center;font-size:1.25rem;color:#8a6d1a}
  .mem-box{display:flex;min-height:192px;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;border-radius:.75rem;background:#fbf8f1;padding:2rem;text-align:center}
  .mem-icon{display:flex;height:3.5rem;width:3.5rem;align-items:center;justify-content:center;border-radius:9999px;background:#f5ebd0}
  .mem-title{font-size:1.5rem;color:#1e4d3b}
  .mem-sub{font-size:.875rem;color:#6e7b72}
  .rec-line{display:flex;align-items:center;gap:.5rem;font-size:1.125rem;font-weight:700;color:#b3261e}
  .rec-dot{display:inline-block;height:.75rem;width:.75rem;border-radius:9999px;background:#b3261e;animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .tips{text-align:center}
  .tip-fade{font-size:.875rem;color:#6e7b72;animation:fade-in .6s ease-out}
  @keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .recorder-col{margin-top:1.25rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
  .meter{display:flex;height:4rem;align-items:flex-end;gap:.25rem}
  .meter i{display:block;width:6px;border-radius:9999px;transition:height .1s;background:#e6decb}
  .mic-btn{
    display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;
    color:#fdfbf5;background:linear-gradient(135deg,#1e4d3b,#2e6b54);
    box-shadow:0 6px 18px rgb(30 77 59 / .35);transition:transform .15s,box-shadow .15s;touch-action:manipulation;
  }
  .mic-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 8px 22px rgb(30 77 59 / .45)}
  .mic-btn:active:not(:disabled){transform:scale(.98)}
  .mic-btn:disabled{opacity:.5;cursor:not-allowed}
  .mic-btn-recording{background:linear-gradient(135deg,#b3261e,#d43b31);animation:mic-pulse 1.6s ease-out infinite}
  @keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgb(179 38 30 / .45)}70%{box-shadow:0 0 0 22px rgb(179 38 30 / 0)}100%{box-shadow:0 0 0 0 rgb(179 38 30 / 0)}}
  .rec-status{text-align:center;color:#6e7b72}
  .rec-status .rec-line{justify-content:center}
  .alert{border-radius:.5rem;background:#f9e3e1;padding:.5rem 1rem;font-size:.875rem;color:#b3261e}
  /* mic activation card */
  .mic-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
  .mic-info{display:flex;align-items:center;gap:.625rem;min-width:0}
  .mic-info h2{font-size:.875rem;font-weight:700;color:#24312a}
  .mic-info p{font-size:.75rem;line-height:1.4;color:#6e7b72}
  .mic-ico{display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;border-radius:9999px;flex-shrink:0}
  .mic-pill{display:inline-flex;align-items:center;gap:.375rem;border-radius:9999px;background:#1e4d3b;color:#fff;font-size:.75rem;font-weight:700;padding:.5rem 1rem;transition:background .15s;flex-shrink:0}
  .mic-pill:hover{background:#163b2e}
  .mic-pill:disabled{opacity:.6;cursor:wait}
  .mic-pill-alt{background:#fff;color:#1e4d3b;border:1px solid #e6decb}
  .mic-pill-alt:hover{background:#eef5f0}
  .mic-pill-ghost{background:#fff;color:#1e4d3b;border:1px solid #e6decb;font-size:.6875rem;font-weight:600;padding:.35rem .75rem}
  .mic-pill-ghost:hover{background:#eef5f0}
  .mic-pill-ghost.danger{color:#b3261e;border-color:rgba(179,38,30,.3)}
  .frame-hint{margin-top:.75rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;background:#fbf8f1;border-radius:.75rem;padding:.6rem .9rem}
  .frame-hint p{font-size:.6875rem;line-height:1.4;color:#6e7b72}
  .mic-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem}
  .mic-banner span{font-size:.75rem;line-height:1.4}
  .mic-help{margin-top:.75rem;border:1px solid #e6decb;border-radius:.75rem;background:#fbf8f1;padding:.6rem .9rem}
  .mic-help summary{cursor:pointer;font-size:.78rem;font-weight:700;color:#b3261e}
  .mic-help[open] summary{margin-bottom:.5rem}
  .mic-help-steps{margin:0;padding-inline-start:1.4rem;font-size:.75rem;line-height:1.8;color:#4a4340}
  .mic-help-steps li{margin-bottom:.3rem}
  .mic-help-steps b{color:#b3261e}
  .mic-help-note{margin:.5rem 0 0;font-size:.6875rem;line-height:1.7;color:#6e7b72}
  .take-panel{display:flex;width:100%;flex-direction:column;align-items:center;gap:.75rem}
  .take-audio{width:100%;max-width:24rem}
  .actions-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- results ---------- */
  .score-head{display:flex;flex-direction:column;align-items:center;gap:.25rem}
  .score-head small{font-size:.875rem;color:#6e7b72}
  .score-head h1{font-size:1.5rem;font-weight:700;color:#1e4d3b}
  .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center small{font-size:.875rem;color:#6e7b72}
  .ring-center .score{font-size:2.25rem;font-weight:700}
  .ring-center .of{font-size:12px;color:#6e7b72}
  .ring-center .sub{margin-top:.25rem;font-size:12px;font-weight:600}
  .grade-pill{border-radius:9999px;padding:.25rem 1rem;font-size:.875rem;font-weight:700}
  .asr-note{display:flex;align-items:center;gap:.375rem;font-size:12px;color:#8a6d1a}
  .bd-row{margin-bottom:.75rem}
  .bd-row:last-child{margin-bottom:0}
  .bd-head{margin-bottom:.25rem;display:flex;align-items:center;justify-content:space-between;font-size:12px}
  .bd-head .lbl{font-weight:600;color:#24312a}
  .bd-head .lbl small{font-weight:400;color:#6e7b72}
  .bd-head .val{font-weight:700}
  .bd-track{height:.625rem;width:100%;overflow:hidden;border-radius:9999px;background:#f2ede1}
  .bd-fill{height:100%;border-radius:9999px;transition:width .8s ease-out;animation:bar-grow .9s ease-out}
  @keyframes bar-grow{from{width:0}}
  .bd-desc{margin-top:.25rem;font-size:11px;color:#6e7b72}
  .notes-list{display:flex;flex-direction:column;gap:.625rem}
  .notes-list li{display:flex;align-items:flex-start;gap:.5rem;font-size:.875rem;line-height:1.5rem;color:#24312a;list-style:none}
  .legend{display:flex;align-items:center;gap:.75rem;font-size:11px;color:#6e7b72}
  .legend span{display:inline-flex;align-items:center;gap:.25rem}
  .dot{display:inline-block;height:.625rem;width:.625rem;border-radius:9999px}
  .w-correct{color:#234b3a}
  .w-sub{color:#b3261e;background:#fbeae9;border-radius:.35em;padding:0 .15em;border-bottom:2px solid #b3261e;cursor:help}
  .w-missing{color:#b3261e;opacity:.8;border-bottom:2px dotted #b3261e;padding:0 .1em}
  .extras-note{margin-top:.5rem;font-size:12px;color:#8a6d1a}
  .results-actions{margin-top:1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem}

  /* ---------- progress ---------- */
  .progress-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
  .progress-head h1{font-size:1.25rem;font-weight:700;color:#1e4d3b}
  .profile-bar{margin-bottom:.75rem;display:flex;flex-wrap:wrap;align-items:center;column-gap:1rem;row-gap:.375rem;border:1px solid #e6decb;background:#fff;border-radius:1rem;padding:.75rem 1rem;font-size:.875rem;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
  .profile-bar span{display:inline-flex;align-items:center;gap:.375rem;color:#6e7b72}
  .profile-bar b{color:#1e4d3b}
  .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
  @media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .stat-card{border:1px solid #e6decb;background:#fff;border-radius:1rem;padding:1rem;text-align:center;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
  .stat-card .v{font-size:1.875rem;font-weight:700}
  .stat-card .l{margin-top:.25rem;font-size:12px;color:#6e7b72}
  .badges-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
  @media(min-width:640px){.badges-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .badge-card{border-radius:.75rem;border:1px solid #e6decb;background:#f7f4ec;padding:.75rem;text-align:center;transition:background-color .2s;opacity:.55}
  .badge-card.earned{border-color:#c9a227;background:#f5ebd0;opacity:1}
  .badge-card .ic{font-size:1.875rem}
  .badge-card.earned .ic{filter:none}
  .badge-card .ic{filter:grayscale(1)}
  .badge-card.earned .ic{filter:none}
  .badge-card p{margin-top:.25rem;font-size:12px;font-weight:700;color:#24312a}
  .badge-card small{font-size:10px;line-height:1rem;color:#6e7b72}
  .chart-empty{padding:2rem 0;text-align:center;font-size:.875rem;color:#6e7b72}
  .table-wrap{max-height:20rem;overflow-y:auto;border-radius:.75rem;border:1px solid #ede6d4;scrollbar-width:thin}
  table{width:100%;border-collapse:collapse;text-align:right;font-size:.875rem}
  thead th{position:sticky;top:0;background:#f5f1e6;font-size:12px;font-weight:600;color:#6e7b72;padding:.5rem .75rem;text-align:right}
  tbody td{padding:.5rem .75rem;border-top:1px solid #ede6d4}
  tbody td.date{font-size:12px;color:#6e7b72}
  tbody td.mark span{display:inline-block;min-width:2.5rem;border-radius:9999px;padding:.125rem .5rem;text-align:center;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header class="app-header">

ext": "فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ"}, {"n": 25, "text": "فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلْءَاخِرَةِ وَٱلْأُولَىٰٓ"}, {"n": 26, "text": "إِنَّ فِى ذَٰلِكَ لَعِبْرَةًۭ لِّمَن يَخْشَىٰٓ"}, {"n": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, {"n": 28, "text": "رَفَعَ سَمْكَهَا فَسَوَّىٰهَا"}, {"n": 29, "text": "وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا"}, {"n": 30, "text": "وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ"}, {"n": 31, "text": "أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَىٰهَا"}, {"n": 32, "text": "وَٱلْجِبَالَ أَرْسَىٰهَا"}, {"n": 33, "text": "مَتَٰعًۭا لَّكُمْ وَلِأَنْعَٰمِكُمْ"}, {"n": 34, "text": "فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلْكُبْرَىٰ"}, {"n": 35, "text": "يَوْمَ يَتَذَكَّرُ ٱلْإِنسَٰنُ مَا سَعَىٰ"}, {"n": 36, "text": "وَبُرِّزَتِ ٱلْجَحِيمُ لِمَن يَرَىٰ"}, {"n": 37, "text": "فَأَمَّا مَن طَغَىٰ"}, {"n": 38, "text": "وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا"}, {"n": 39, "text": "فَإِنَّ ٱلْجَحِيمَ هِىَ ٱلْمَأْوَىٰ"}, {"n": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, {"n": 41, "text": "فَإِنَّ ٱلْجَنَّةَ هِىَ ٱلْمَأْوَىٰ"}, {"n": 42, "text": "يَسْـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرْسَىٰهَا"}, {"n": 43, "text": "فِيمَ أَنتَ مِن ذِكْرَىٰهَآ"}, {"n": 44, "text": "إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ"}, {"n": 45, "text": "إِنَّمَآ أَنتَ مُنذِرُ مَن يَخْشَىٰهَا"}, {"n": 46, "text": "كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓا۟ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا"}], "ayahCount": 46, "duration": 256.44}, {"id": 80, "name": "سُورَةُ عَبَسَ", "englishName": "Abasa", "ayahs": [{"n": 1, "text": "عَبَسَ وَتَوَلَّىٰٓ"}, {"n": 2, "text": "أَن جَآءَهُ ٱلْأَعْمَىٰ"}, {"n": 3, "text": "وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ"}, {"n": 4, "text": "أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ"}, {"n": 5, "text": "أَمَّا مَنِ ٱسْتَغْنَىٰ"}, {"n": 6, "text": "فَأَنتَ لَهُۥ تَصَدَّىٰ"}, {"n": 7, "text": "وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ"}, {"n": 8, "text": "وَأَمَّا مَن جَآءَكَ يَسْعَىٰ"}, {"n": 9, "text": "وَهُوَ يَخْشَىٰ"}, {"n": 10, "text": "فَأَنتَ عَنْهُ تَلَهَّىٰ"}, {"n": 11, "text": "كَلَّآ إِنَّهَا تَذْكِرَةٌۭ"}, {"n": 12, "text": "فَمَن شَآءَ ذَكَرَهُۥ"}, {"n": 13, "text": "فِى صُحُفٍۢ مُّكَرَّمَةٍۢ"}, {"n": 14, "text": "مَّرْفُوعَةٍۢ مُّطَهَّرَةٍۭ"}, {"n": 15, "text": "بِأَيْدِى سَفَرَةٍۢ"}, {"n": 16, "text": "كِرَامٍۭ بَرَرَةٍۢ"}, {"n": 17, "text": "قُتِلَ ٱلْإِنسَٰنُ مَآ أَكْفَرَهُۥ"}, {"n": 18, "text": "مِنْ أَىِّ شَىْءٍ خَلَقَهُۥ"}, {"n": 19, "text": "مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ"}, {"n": 20, "text": "ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ"}, {"n": 21, "text": "ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ"}, {"n": 22, "text": "ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ"}, {"n": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, {"n": 24, "text": "فَلْيَنظُرِ ٱلْإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ"}, {"n": 25, "text": "أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّۭا"}, {"n": 26, "text": "ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّۭا"}, {"n": 27, "text": "فَأَنۢبَتْنَا فِيهَا حَبًّۭا"}, {"n": 28, "text": "وَعِنَبًۭا وَقَضْبًۭا"}, {"n": 29, "text": "وَزَيْتُونًۭا وَنَخْلًۭا"}, {"n": 30, "text": "وَحَدَآئِقَ غُلْبًۭا"}, {"n": 31, "text": "وَفَٰكِهَةًۭ وَأَبًّۭا"}, {"n": 32, "text": "مَّتَٰعًۭا لَّكُمْ وَلِأَنْعَٰمِكُمْ"}, {"n": 33, "text": "فَإِذَا جَآءَتِ ٱلصَّآخَّةُ"}, {"n": 34, "text": "يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ"}, {"n": 35, "text": "وَأُمِّهِۦ وَأَبِيهِ"}, {"n": 36, "text": "وَصَٰحِبَتِهِۦ وَبَنِيهِ"}, {"n": 37, "text": "لِكُلِّ ٱمْرِئٍۢ مِّنْهُمْ يَوْمَئِذٍۢ شَأْنٌۭ يُغْنِيهِ"}, {"n": 38, "text": "وُجُوهٌۭ يَوْمَئِذٍۢ مُّسْفِرَةٌۭ"}, {"n": 39, "text": "ضَاحِكَةٌۭ مُّسْتَبْشِرَةٌۭ"}, {"n": 40, "text": "وَوُجُوهٌۭ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌۭ"}, {"n": 41, "text": "تَرْهَقُهَا قَتَرَةٌ"}, {"n": 42, "text": "أُو۟لَٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ"}], "ayahCount": 42, "duration": 220.42}, {"id": 81, "name": "سُورَةُ التَّكۡوِيرِ", "englishName": "At-Takwir", "ayahs": [{"n": 1, "text": "إِذَا ٱلشَّمْسُ كُوِّرَتْ"}, {"n": 2, "text": "وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ"}, {"n": 3, "text": "وَإِذَا ٱلْجِبَالُ سُيِّرَتْ"}, {"n": 4, "text": "وَإِذَا ٱلْعِشَارُ عُطِّلَتْ"}, {"n": 5, "text": "وَإِذَا ٱلْوُحُوشُ حُشِرَتْ"}, {"n": 6, "text": "وَإِذَا ٱلْبِحَارُ سُجِّرَتْ"}, {"n": 7, "text": "وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ"}, {"n": 8, "text": "وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ"}, {"n": 9, "text": "بِأَىِّ ذَنۢبٍۢ قُتِلَتْ"}, {"n": 10, "text": "وَإِذَا ٱلصُّحُفُ نُشِرَتْ"}, {"n": 11, "text": "وَإِذَا ٱلسَّمَآءُ كُشِطَتْ"}, {"n": 12, "text": "وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ"}, {"n": 13, "text": "وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ"}, {"n": 14, "text": "عَلِمَتْ نَفْسٌۭ مَّآ أَحْضَرَتْ"}, {"n": 15, "text": "فَلَآ أُقْسِمُ بِٱلْخُنَّسِ"}, {"n": 16, "text": "ٱلْجَوَارِ ٱلْكُنَّسِ"}, {"n": 17, "text": "وَٱلَّيْلِ إِذَا عَسْعَسَ"}, {"n": 18, "text": "وَٱلصُّبْحِ إِذَا تَنَفَّسَ"}, {"n": 19, "text": "إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ"}, {"n": 20, "text": "ذِى قُوَّةٍ عِندَ ذِى ٱلْعَرْشِ مَكِينٍۢ"}, {"n": 21, "text": "مُّطَاعٍۢ ثَمَّ أَمِينٍۢ"}, {"n": 22, "text": "وَمَا صَاحِبُكُم بِمَجْنُونٍۢ"}, {"n": 23, "text": "وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ"}, {"n": 24, "text": "وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍۢ"}, {"n": 25, "text": "وَمَا هُوَ بِقَوْلِ شَيْطَٰنٍۢ رَّجِيمٍۢ"}, {"n": 26, "text": "فَأَيْنَ تَذْهَبُونَ"}, {"n": 27, "text": "إِنْ هُوَ إِلَّا ذِكْرٌۭ لِّلْعَٰلَمِينَ"}, {"n": 28, "text": "لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ"}, {"n": 29, "text": "وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ"}], "ayahCount": 29, "duration": 158.33}, {"id": 82, "name": "سُورَةُ الانفِطَارِ", "englishName": "Al-Infitaar", "ayahs": [{"n": 1, "text": "إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ"}, {"n": 2, "text": "وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ"}, {"n": 3, "text": "وَإِذَا ٱلْبِحَارُ فُجِّرَتْ"}, {"n": 4, "text": "وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ"}, {"n": 5, "text": "عَلِمَتْ نَفْسٌۭ مَّا قَدَّمَتْ وَأَخَّرَتْ"}, {"n": 6, "text": "يَٰٓأَيُّهَا ٱلْإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ"}, {"n": 7, "text": "ٱلَّذِى خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ"}, {"n": 8, "text": "فِىٓ أَىِّ صُورَةٍۢ مَّا شَآءَ رَكَّبَكَ"}, {"n": 9, "text": "كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ"}, {"n": 10, "text": "وَإِنَّ عَلَيْكُمْ لَحَٰفِظِينَ"}, {"n": 11, "text": "كِرَامًۭا كَٰتِبِينَ"}, {"n": 12, "text": "يَعْلَمُونَ مَا تَفْعَلُونَ"}, {"n": 13, "text": "إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍۢ"}, {"n": 14, "text": "وَإِنَّ ٱلْفُجَّارَ لَفِى جَحِيمٍۢ"}, {"n": 15, "text": "يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ"}, {"n": 16, "text": "وَمَا هُمْ عَنْهَا بِغَآئِبِينَ"}, {"n": 17, "text": "وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, {"n": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, {"n": 19, "text": "يَوْمَ لَا تَمْلِكُ نَفْسٌۭ لِّنَفْسٍۢ شَيْـًۭٔا ۖ وَٱلْأَمْرُ يَوْمَئِذٍۢ لِّلَّهِ"}], "ayahCount": 19, "duration": 136.78}, {"id": 83, "name": "سُورَةُ المُطَفِّفِينَ", "englishName": "Al-Mutaffifin", "ayahs": [{"n": 1, "text": "وَيْلٌۭ لِّلْمُطَفِّفِينَ"}, {"n": 2, "text": "ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ"}, {"n": 3, "text": "وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ"}, {"n": 4, "text": "أَلَا يَظُنُّ أُو۟لَٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ"}, {"n": 5, "text": "لِيَوْمٍ عَظِيمٍۢ"}, {"n": 6, "text": "يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَٰلَمِينَ"}, {"n": 7, "text": "كَلَّآ إِنَّ كِتَٰبَ ٱلْفُجَّارِ لَفِى سِجِّينٍۢ"}, {"n": 8, "text": "وَمَآ أَدْرَىٰكَ مَا سِجِّينٌۭ"}, {"n": 9, "text": "كِتَٰبٌۭ مَّرْقُومٌۭ"}, {"n": 10, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, {"n": 11, "text": "ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ"}, {"n": 12, "text": "وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ"}, {"n": 13, "text": "إِذَا تُتْلَىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلْأَوَّلِينَ"}, {"n": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, {"n": 15, "text": "كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍۢ لَّمَحْجُوبُونَ"}, {"n": 16, "text": "ثُمَّ إِنَّهُمْ لَصَالُوا۟ ٱلْجَحِيمِ"}, {"n": 17, "text": "ثُمَّ يُقَالُ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تُكَذِّبُونَ"}, {"n": 18, "text": "كَلَّآ إِنَّ كِتَٰبَ ٱلْأَبْرَارِ لَفِى عِلِّيِّينَ"}, {"n": 19, "text": "وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ"}, {"n": 20, "text": "كِتَٰبٌۭ مَّرْقُومٌۭ"}, {"n": 21, "text": "يَشْهَدُهُ ٱلْمُقَرَّبُونَ"}, {"n": 22, "text": "إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ"}, {"n": 23, "text": "عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ"}, {"n": 24, "text": "تَعْرِفُ فِى وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ"}, {"n": 25, "text": "يُسْقَوْنَ مِن رَّحِيقٍۢ مَّخْتُومٍ"}, {"n": 26, "text": "خِتَٰمُهُۥ مِسْكٌۭ ۚ وَفِى ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَٰفِسُونَ"}, {"n": 27, "text": "وَمِزَاجُهُۥ مِن تَسْنِيمٍ"}, {"n": 28, "text": "عَيْنًۭا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ"}, {"n": 29, "text": "إِنَّ ٱلَّذِينَ أَجْرَمُوا۟ كَانُوا۟ مِنَ ٱلَّذِينَ ءَامَنُوا۟ يَضْحَكُونَ"}, {"n": 30, "text": "وَإِذَا مَرُّوا۟ بِهِمْ يَتَغَامَزُونَ"}, {"n": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, {"n": 32, "text": "وَإِذَا رَأَوْهُمْ قَالُوٓا۟ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ"}, {"n": 33, "text": "وَمَآ أُرْسِلُوا۟ عَلَيْهِمْ حَٰفِظِينَ"}, {"n": 34, "text": "فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُوا۟ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ"}, {"n": 35, "text": "عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ"}, {"n": 36, "text": "هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُوا۟ يَفْعَلُونَ"}], "ayahCount": 36, "duration": 310.28}, {"id": 84, "name": "سُورَةُ الانشِقَاقِ", "englishName": "Al-Inshiqaaq", "ayahs": [{"n": 1, "text": "إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ"}, {"n": 2, "text": "وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ"}, {"n": 3, "text": "وَإِذَا ٱلْأَرْضُ مُدَّتْ"}, {"n": 4, "text": "وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ"}, {"n": 5, "text": "وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ"}, {"n": 6, "text": "يَٰٓأَيُّهَا ٱلْإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًۭا فَمُلَٰقِيهِ"}, {"n": 7, "text": "فَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِيَمِينِهِۦ"}, {"n": 8, "text": "فَسَوْفَ يُحَاسَبُ حِسَابًۭا يَسِيرًۭا"}, {"n": 9, "text": "وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًۭا"}, {"n": 10, "text": "وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ"}, {"n": 11, "text": "فَسَوْفَ يَدْعُوا۟ ثُبُورًۭا"}, {"n": 12, "text": "وَيَصْلَىٰ سَعِيرًا"}, {"n": 13, "text": "إِنَّهُۥ كَانَ فِىٓ أَهْلِهِۦ مَسْرُورًا"}, {"n": 14, "text": "إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ"}, {"n": 15, "text": "بَلَىٰٓ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًۭا"}, {"n": 16, "text": "فَلَآ أُقْسِمُ بِٱلشَّفَقِ"}, {"n": 17, "text": "وَٱلَّيْلِ وَمَا وَسَقَ"}, {"n": 18, "text": "وَٱلْقَمَرِ إِذَا ٱتَّسَقَ"}, {"n": 19, "text": "لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍۢ"}, {"n": 20, "text": "فَمَا لَهُمْ لَا يُؤْمِنُونَ"}, {"n": 21, "text": "وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَ ۩"}, {"n": 22, "text": "بَلِ ٱلَّذِينَ كَفَرُوا۟ يُكَذِّبُونَ"}, {"n": 23, "text": "وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ"}, {"n": 24, "text": "فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ"}, {"n": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}], "ayahCount": 25, "duration": 160.21}, {"id": 85, "name": "سُورَةُ البُرُوجِ", "englishName": "Al-Burooj", "ayahs": [{"n": 1, "text": "وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ"}, {"n": 2, "text": "وَٱلْيَوْمِ ٱلْمَوْعُودِ"}, {"n": 3, "text": "وَشَاهِدٍۢ وَمَشْهُودٍۢ"}, {"n": 4, "text": "قُتِلَ أَصْحَٰبُ ٱلْأُخْدُودِ"}, {"n": 5, "text": "ٱلنَّارِ ذَاتِ ٱلْوَقُودِ"}, {"n": 6, "text": "إِذْ هُمْ عَلَيْهَا قُعُودٌۭ"}, {"n": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, {"n": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, {"n": 9, "text": "ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ شَهِيدٌ"}, {"n": 10, "text": "إِنَّ ٱلَّذِينَ فَتَنُوا۟ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ثُمَّ لَمْ يَتُوبُوا۟ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ"}, {"n": 11, "text": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٌۭ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ"}, {"n": 12, "text": "إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ"}, {"n": 13, "text": "إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ"}, {"n": 14, "text": "وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ"}, {"n": 15, "text": "ذُو ٱلْعَرْشِ ٱلْمَجِيدُ"}, {"n": 16, "text": "فَعَّالٌۭ لِّمَا يُرِيدُ"}, {"n": 17, "text": "هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ"}, {"n": 18, "text": "فِرْعَوْنَ وَثَمُودَ"}, {"n": 19, "text": "بَلِ ٱلَّذِينَ كَفَرُوا۟ فِى تَكْذِيبٍۢ"}, {"n": 20, "text": "وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطٌۢ"}, {"n": 21, "text": "بَلْ هُوَ قُرْءَانٌۭ مَّجِيدٌۭ"}, {"n": 22, "text": "فِى لَوْحٍۢ مَّحْفُوظٍۭ"}], "ayahCount": 22, "duration": 198.19}, {"id": 86, "name": "سُورَةُ الطَّارِقِ", "englishName": "At-Taariq", "ayahs": [{"n": 1, "text": "وَٱلسَّمَآءِ وَٱلطَّارِقِ"}, {"n": 2, "text": "وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ"}, {"n": 3, "text": "ٱلنَّجْمُ ٱلثَّاقِبُ"}, {"n": 4, "text": "إِن كُلُّ نَفْسٍۢ لَّمَّا عَلَيْهَا حَافِظٌۭ"}, {"n": 5, "text": "فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ"}, {"n": 6, "text": "خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ"}, {"n": 7, "text": "يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ"}, {"n": 8, "text": "إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌۭ"}, {"n": 9, "text": "يَوْمَ تُبْلَى ٱلسَّرَآئِرُ"}, {"n": 10, "text": "فَمَا لَهُۥ مِن قُوَّةٍۢ وَلَا نَاصِرٍۢ"}, {"n": 11, "text": "وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ"}, {"n": 12, "text": "وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ"}, {"n": 13, "text": "إِنَّهُۥ لَقَوْلٌۭ فَصْلٌۭ"}, {"n": 14, "text": "وَمَا هُوَ بِٱلْهَزْلِ"}, {"n": 15, "text": "إِنَّهُمْ يَكِيدُونَ كَيْدًۭا"}, {"n": 16, "text": "وَأَكِيدُ كَيْدًۭا"}, {"n": 17, "text": "فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا"}], "ayahCount": 17, "duration": 100.23}, {"id": 87, "name": "سُورَةُ الأَعۡلَىٰ", "englishName": "Al-A'laa", "ayahs": [{"n": 1, "text": "سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى"}, {"n": 2, "text": "ٱلَّذِى خَلَقَ فَسَوَّىٰ"}, {"n": 3, "text": "وَٱلَّذِى قَدَّرَ فَهَدَىٰ"}, {"n": 4, "text": "وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ"}, {"n": 5, "text": "فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ"}, {"n": 6, "text": "سَنُقْرِئُكَ فَلَا تَنسَىٰٓ"}, {"n": 7, "text": "إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ"}, {"n": 8, "text": "وَنُيَسِّرُكَ لِلْيُسْرَىٰ"}, {"n": 9, "text": "فَذَكِّرْ إِن نَّفَ "text": "وَقَدْ خَابَ مَن دَسَّىٰهَا"}, {"n": 11, "text": "كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ"}, {"n": 12, "text": "إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا"}, {"n": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, {"n": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, {"n": 15, "text": "وَلَا يَخَافُ عُقْبَٰهَا"}], "ayahCount": 15, "duration": 84.43}, {"id": 92, "name": "سُورَةُ اللَّيۡلِ", "englishName": "Al-Lail", "ayahs": [{"n": 1, "text": "وَٱلَّيْلِ إِذَا يَغْشَىٰ"}, {"n": 2, "text": "وَٱلنَّهَارِ إِذَا تَجَلَّىٰ"}, {"n": 3, "text": "وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ"}, {"n": 4, "text": "إِنَّ سَعْيَكُمْ لَشَتَّىٰ"}, {"n": 5, "text": "فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ"}, {"n": 6, "text": "وَصَدَّقَ بِٱلْحُسْنَىٰ"}, {"n": 7, "text": "فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ"}, {"n": 8, "text": "وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ"}, {"n": 9, "text": "وَكَذَّبَ بِٱلْحُسْنَىٰ"}, {"n": 10, "text": "فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ"}, {"n": 11, "text": "وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ"}, {"n": 12, "text": "إِنَّ عَلَيْنَا لَلْهُدَىٰ"}, {"n": 13, "text": "وَإِنَّ لَنَا لَلْءَاخِرَةَ وَٱلْأُولَىٰ"}, {"n": 14, "text": "فَأَنذَرْتُكُمْ نَارًۭا تَلَظَّىٰ"}, {"n": 15, "text": "لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى"}, {"n": 16, "text": "ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ"}, {"n": 17, "text": "وَسَيُجَنَّبُهَا ٱلْأَتْقَى"}, {"n": 18, "text": "ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ"}, {"n": 19, "text": "وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍۢ تُجْزَىٰٓ"}, {"n": 20, "text": "إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ"}, {"n": 21, "text": "وَلَسَوْفَ يَرْضَىٰ"}], "ayahCount": 21, "duration": 111.62}, {"id": 93, "name": "سُورَةُ الضُّحَىٰ", "englishName": "Ad-Dhuhaa", "ayahs": [{"n": 1, "text": "وَٱلضُّحَىٰ"}, {"n": 2, "text": "وَٱلَّيْلِ إِذَا سَجَىٰ"}, {"n": 3, "text": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ"}, {"n": 4, "text": "وَلَلْءَاخِرَةُ خَيْرٌۭ لَّكَ مِنَ ٱلْأُولَىٰ"}, {"n": 5, "text": "وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ"}, {"n": 6, "text": "أَلَمْ يَجِدْكَ يَتِيمًۭا فَـَٔاوَىٰ"}, {"n": 7, "text": "وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ"}, {"n": 8, "text": "وَوَجَدَكَ عَآئِلًۭا فَأَغْنَىٰ"}, {"n": 9, "text": "فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ"}, {"n": 10, "text": "وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ"}, {"n": 11, "text": "وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"}], "ayahCount": 11, "duration": 65.12}, {"id": 94, "name": "سُورَةُ الشَّرۡحِ", "englishName": "Ash-Sharh", "ayahs": [{"n": 1, "text": "أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ"}, {"n": 2, "text": "وَوَضَعْنَا عَنكَ وِزْرَكَ"}, {"n": 3, "text": "ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ"}, {"n": 4, "text": "وَرَفَعْنَا لَكَ ذِكْرَكَ"}, {"n": 5, "text": "فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا"}, {"n": 6, "text": "إِنَّ مَعَ ٱلْعُسْرِ يُسْرًۭا"}, {"n": 7, "text": "فَإِذَا فَرَغْتَ فَٱنصَبْ"}, {"n": 8, "text": "وَإِلَىٰ رَبِّكَ فَٱرْغَب"}], "ayahCount": 8, "duration": 43.02}, {"id": 95, "name": "سُورَةُ التِّينِ", "englishName": "At-Tin", "ayahs": [{"n": 1, "text": "وَٱلتِّينِ وَٱلزَّيْتُونِ"}, {"n": 2, "text": "وَطُورِ سِينِينَ"}, {"n": 3, "text": "وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ"}, {"n": 4, "text": "لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ"}, {"n": 5, "text": "ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ"}, {"n": 6, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۢ"}, {"n": 7, "text": "فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ"}, {"n": 8, "text": "أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ"}], "ayahCount": 8, "duration": 64.94}, {"id": 96, "name": "سُورَةُ العَلَقِ", "englishName": "Al-Alaq", "ayahs": [{"n": 1, "text": "ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, {"n": 2, "text": "خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ"}, {"n": 3, "text": "ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ"}, {"n": 4, "text": "ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ"}, {"n": 5, "text": "عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ"}, {"n": 6, "text": "كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ"}, {"n": 7, "text": "أَن رَّءَاهُ ٱسْتَغْنَىٰٓ"}, {"n": 8, "text": "إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ"}, {"n": 9, "text": "أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ"}, {"n": 10, "text": "عَبْدًا إِذَا صَلَّىٰٓ"}, {"n": 11, "text": "أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ"}, {"n": 12, "text": "أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ"}, {"n": 13, "text": "أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ"}, {"n": 14, "text": "أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ"}, {"n": 15, "text": "كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ"}, {"n": 16, "text": "نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ"}, {"n": 17, "text": "فَلْيَدْعُ نَادِيَهُۥ"}, {"n": 18, "text": "سَنَدْعُ ٱلزَّبَانِيَةَ"}, {"n": 19, "text": "كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب ۩"}], "ayahCount": 19, "duration": 95.14}, {"id": 97, "name": "سُورَةُ القَدۡرِ", "englishName": "Al-Qadr", "ayahs": [{"n": 1, "text": "إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ"}, {"n": 2, "text": "وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ"}, {"n": 3, "text": "لَيْلَةُ ٱلْقَدْرِ خَيْرٌۭ مِّنْ أَلْفِ شَهْرٍۢ"}, {"n": 4, "text": "تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍۢ"}, {"n": 5, "text": "سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"}], "ayahCount": 5, "duration": 45.17}, {"id": 98, "name": "سُورَةُ البَيِّنَةِ", "englishName": "Al-Bayyina", "ayahs": [{"n": 1, "text": "لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ"}, {"n": 2, "text": "رَسُولٌۭ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًۭا مُّطَهَّرَةًۭ"}, {"n": 3, "text": "فِيهَا كُتُبٌۭ قَيِّمَةٌۭ"}, {"n": 4, "text": "وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ"}, {"n": 5, "text": "وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ"}, {"n": 6, "text": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ"}, {"n": 7, "text": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ"}, {"n": 8, "text": "جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ۖ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ"}], "ayahCount": 8, "duration": 126.46}, {"id": 99, "name": "سُورَةُ الزَّلۡزَلَةِ", "englishName": "Az-Zalzala", "ayahs": [{"n": 1, "text": "إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا"}, {"n": 2, "text": "وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا"}, {"n": 3, "text": "وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا"}, {"n": 4, "text": "يَوْمَئِذٍۢ تُحَدِّثُ أَخْبَارَهَا"}, {"n": 5, "text": "بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا"}, {"n": 6, "text": "يَوْمَئِذٍۢ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًۭا لِّيُرَوْا۟ أَعْمَٰلَهُمْ"}, {"n": 7, "text": "فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًۭا يَرَهُۥ"}, {"n": 8, "text": "وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍۢ شَرًّۭا يَرَهُۥ"}], "ayahCount": 8, "duration": 60.0}, {"id": 100, "name": "سُورَةُ العَادِيَاتِ", "englishName": "Al-Aadiyaat", "ayahs": [{"n": 1, "text": "وَٱلْعَٰدِيَٰتِ ضَبْحًۭا"}, {"n": 2, "text": "فَٱلْمُورِيَٰتِ قَدْحًۭا"}, {"n": 3, "text": "فَٱلْمُغِيرَٰتِ صُبْحًۭا"}, {"n": 4, "text": "فَأَثَرْنَ بِهِۦ نَقْعًۭا"}, {"n": 5, "text": "فَوَسَطْنَ بِهِۦ جَمْعًا"}, {"n": 6, "text": "إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌۭ"}, {"n": 7, "text": "وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌۭ"}, {"n": 8, "text": "وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ"}, {"n": 9, "text": "۞ أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ"}, {"n": 10, "text": "وَحُصِّلَ مَا فِى ٱلصُّدُورِ"}, {"n": 11, "text": "إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍۢ لَّخَبِيرٌۢ"}], "ayahCount": 11, "duration": 70.01}, {"id": 101, "name": "سُورَةُ القَارِعَةِ", "englishName": "Al-Qaari'a", "ayahs": [{"n": 1, "text": "ٱلْقَارِعَةُ"}, {"n": 2, "text": "مَا ٱلْقَارِعَةُ"}, {"n": 3, "text": "وَمَآ أَدْرَىٰكَ مَا ٱلْقَارِعَةُ"}, {"n": 4, "text": "يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ"}, {"n": 5, "text": "وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ ٱلْمَنفُوشِ"}, {"n": 6, "text": "فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ"}, {"n": 7, "text": "فَهُوَ فِى عِيشَةٍۢ رَّاضِيَةٍۢ"}, {"n": 8, "text": "وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ"}, {"n": 9, "text": "فَأُمُّهُۥ هَاوِيَةٌۭ"}, {"n": 10, "text": "وَمَآ أَدْرَىٰكَ مَا هِيَهْ"}, {"n": 11, "text": "نَارٌ حَامِيَةٌۢ"}], "ayahCount": 11, "duration": 62.54}, {"id": 102, "name": "سُورَةُ التَّكَاثُرِ", "englishName": "At-Takaathur", "ayahs": [{"n": 1, "text": "أَلْهَىٰكُمُ ٱلتَّكَاثُرُ"}, {"n": 2, "text": "حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ"}, {"n": 3, "text": "كَلَّا سَوْفَ تَعْلَمُونَ"}, {"n": 4, "text": "ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ"}, {"n": 5, "text": "كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ"}, {"n": 6, "text": "لَتَرَوُنَّ ٱلْجَحِيمَ"}, {"n": 7, "text": "ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ"}, {"n": 8, "text": "ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ"}], "ayahCount": 8, "duration": 62.59}, {"id": 103, "name": "سُورَةُ العَصۡرِ", "englishName": "Al-Asr", "ayahs": [{"n": 1, "text": "وَٱلْعَصْرِ"}, {"n": 2, "text": "إِنَّ ٱلْإِنسَٰنَ لَفِى خُسْرٍ"}, {"n": 3, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ"}], "ayahCount": 3, "duration": 27.4}, {"id": 104, "name": "سُورَةُ الهُمَزَةِ", "englishName": "Al-Humaza", "ayahs": [{"n": 1, "text": "وَيْلٌۭ لِّكُلِّ هُمَزَةٍۢ لُّمَزَةٍ"}, {"n": 2, "text": "ٱلَّذِى جَمَعَ مَالًۭا وَعَدَّدَهُۥ"}, {"n": 3, "text": "يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ"}, {"n": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, {"n": 5, "text": "وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ"}, {"n": 6, "text": "نَارُ ٱللَّهِ ٱلْمُوقَدَةُ"}, {"n": 7, "text": "ٱلَّتِى تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ"}, {"n": 8, "text": "إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌۭ"}, {"n": 9, "text": "فِى عَمَدٍۢ مُّمَدَّدَةٍۭ"}], "ayahCount": 9, "duration": 58.02}, {"id": 105, "name": "سُورَةُ الفِيلِ", "englishName": "Al-Fil", "ayahs": [{"n": 1, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, {"n": 2, "text": "أَلَمْ يَج     const pn = pausesNote(metrics, surah);
    if (pn) notes.push(pn);
    if ((metrics.longGaps || 0) > 0) notes.push("يوجد صمت طويل أثناء التسجيل — اقتربي من الميكروفون ومواصلي التلاوة دون توقف طويل.");
  } else {
    weights = { accuracy: 0, completeness: 40, pacing: 30, steadiness: 20 };
    const segRatio = clamp(metrics.segments / Math.max(2, ref.segments), 0, 1.15);
    const pauseRatio = clamp(metrics.pauses / Math.max(2, ref.pauses), 0, 1.15);
    const completeness = Math.round(clamp(0.6 * segRatio + 0.4 * pauseRatio, 0, 1) * 100);
    const speechDur = metrics.speechDuration || metrics.duration * (metrics.speechRatio || ref.speechRatio);
    const pacing = pacingScore(refSpeech > 0 ? speechDur / refSpeech : 100);
    const steadiness = Math.round(clamp(100 - Math.abs(metrics.speechRatio - ref.speechRatio) * 250 - (metrics.longGaps || 0) * 12, 25, 100));
    breakdown = { accuracy: 0, completeness, pacing, steadiness };
    score = Math.round(completeness * 0.4 + pacing * 0.3 + steadiness * 0.2);
    notes.push("تعذّر تحليل النص المنطوق لهذا التسجيل، فحُسبت العلامة من المؤشرات الصوتية: الاكتمال والإيقاع والثبات.");
    const ratio = speechDur / refSpeech;
    if (ratio < 0.8) notes.push("قراءتك أسرع من التلاوة المرجعية بنحو " + Math.round((1 - ratio) * 100) + "%.");
    else if (ratio > 1.5) notes.push("قراءتك أبطأ من التلاوة المرجعية بنحو " + Math.round((ratio - 1) * 100) + "%.");
    else notes.push("سرعتك قريبة من التلاوة المرجعية.");
  }

  const g = gradeFor(score);
  if (score >= 90 && !notes.some((n) => n.includes("ما شاء الله"))) notes.unshift("أحسنتِ! علامتك ممتازة، استمري على هذا الإتقان.");

  return {
    ok: true, score,
    grade: g.label, gradeColor: g.color, gradeBg: g.bg,
    breakdown, weights,
    asrUsed, transcript: asrUsed ? transcript : null,
    text: refDisplayWords.map((words, i) => ({ n: surah.ayahs[i].n, words, fullyMissing: words.every((w) => w.status === "missing") })),
    missingAyahs, extrasCount, notes, metrics
  };
}

/* ============ recorder (+ browser speech recognition as ASR) ============ */
const MAX_SECONDS = 600;
const rec = {
  state: "idle", seconds: 0, level: 0, error: null, result: null,
  stream: null, ctx: null, analyser: null, mediaRec: null, chunks: [], processor: null, pcm: [],
  wavMode: false, raf: 0, timer: null, secs: 0, levelVal: 0,
  sr: null, srFinal: "", srInterim: "",
  srSupported: !!(window.SpeechRecognition || window.webkitSpeechRecognition)
};
function recCleanup() {
  if (rec.raf) cancelAnimationFrame(rec.raf);
  if (rec.timer) clearInterval(rec.timer);
  rec.timer = null;
  if (rec.processor) { rec.processor.disconnect(); rec.processor = null; }
  if (rec.stream) { rec.stream.getTracks().forEach((t) => t.stop()); rec.stream = null; }
  if (rec.ctx && rec.ctx.state !== "closed") rec.ctx.close().catch(() => {});
  rec.ctx = null; rec.analyser = null; rec.mediaRec = null;
}
function recStartTipsUpdate() { /* tips rotate via interval set in renderRecite */ }
async function recStart() {
  rec.error = null;
  if (rec.result) { URL.revokeObjectURL(rec.result.url); rec.result = null; }
  rec.seconds = 0; rec.level = 0; rec.secs = 0; rec.levelVal = 0;
  rec.chunks = []; rec.pcm = []; rec.srFinal = ""; rec.srInterim = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    rec.stream = stream;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx(); rec.ctx = ctx;
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    source.connect(analyser); rec.analyser = analyser;
    rec.wavMode = false;
    if (typeof MediaRecorder !== "undefined") {
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
        : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : null;
      if (mime) {
        const mr = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 96000 });
        mr.ondataavailable = (e) => { if (e.data.size > 0) rec.chunks.push(e.data); };
        mr.start(1000);
        rec.mediaRec = mr;
      } else rec.wavMode = true;
    } else rec.wavMode = true;
    if (rec.wavMode) {
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = (e) => { rec.pcm.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
      source.connect(proc); proc.connect(ctx.destination);
      rec.processor = proc;
    }
    // browser speech recognition (works in Chrome/Edge with internet; app falls back to audio-only otherwise)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      try {
        const sr = new SR();
        sr.lang = "ar-SA"; sr.continuous = true; sr.interimResults = true;
        sr.onresult = (e) => {
          let fin = "", intr = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) fin += r[0].transcript + " "; else intr += r[0].transcript + " ";
          }
          rec.srFinal += fin; rec.srInterim = intr;
        };
        sr.onerror = () => {};
        sr.start();
        rec.sr = sr;
      } catch (e) { rec.sr = null; }
    }
    const buf = new Float32Array(analyser.fftSize);
    const meterBars = () => document.querySelectorAll("#meter i");
    const tick = () => {
      if (!rec.analyser) return;
      rec.analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const l = Math.min(1, rms * 6);
      rec.levelVal = rec.levelVal * 0.7 + l * 0.3;
      rec.level = rec.levelVal;
      const bars = meterBars();
      for (let i = 0; i < bars.length; i++) {
        const h = Math.max(6, rec.level * 100 * (0.55 + 0.45 * Math.sin(i * 0.9 + Date.now() / 90)));
        bars[i].style.height = Math.min(100, h) + "%";
        bars[i].style.background = "#c9a227";
      }
      rec.raf = requestAnimationFrame(tick);
    };
    rec.raf = requestAnimationFrame(tick);
    rec.timer = setInterval(() => {
      rec.secs++; rec.seconds = rec.secs;
      const t1 = $("#rec-timer-1"), t2 = $("#rec-timer-2");
      const txt = fmtClock(rec.seconds);
      if (t1) t1.textContent = txt;
      if (t2) t2.textContent = txt;
      if (rec.secs >= MAX_SECONDS) recStop();
    }, 1000);
    rec.state = "recording";
    render(); // swaps ayah text into memorization (hidden) mode
  } catch (e) {
    recCleanup();
    const name = e && e.name;
    micSetFromError(name);
    rec.error = (name === "NotAllowedError" || name === "SecurityError")
      ? "لم يُسمح بالوصول إلى الميكروفون — اتبعي خطوات السماح في «دليل المايكروفون» أعلى الشاشة ثم أعيدي المحاولة."
      : name === "NotFoundError" || name === "NotReadableError"
        ? "لم يُعثر على مايكروفون — تأكدي من توصيله وأنه غير مشغول بتطبيق آخر ثم أعيدي المحاولة."
        : "تعذّر بدء التسجيل. تأكدي من الميكروفون ثم أعيدي المحاولة.";
    render();
  }
}
async function recStop() {
  if (rec.state !== "recording") return;
  rec.state = "analyzing";
  render();
  try {
    const mime = rec.wavMode ? "audio/wav" : (rec.mediaRec && rec.mediaRec.mimeType) || "audio/webm";
    let blob = null;
    if (rec.mediaRec && rec.mediaRec.state !== "inactive") {
      await new Promise((res) => { rec.mediaRec.onstop = () => res(); rec.mediaRec.stop(); });
      if (rec.chunks.length) blob = new Blob(rec.chunks, { type: mime.split(";")[0] });
    } else if (rec.wavMode) {
      const total = rec.pcm.reduce((s, a) => s + a.length, 0);
      const x = new Float32Array(total);
      let off = 0;
      for (const c of rec.pcm) { x.set(c, off); off += c.length; }
      blob = encodeWav(x, rec.ctx ? rec.ctx.sampleRate : 44100);
    }
    if (rec.sr) { try { rec.sr.stop(); } catch (e) {} }
    await new Promise((r) => setTimeout(r, 500)); // let final recognition results arrive
    const transcript = (rec.srFinal + " " + rec.srInterim).replace(/\s+/g, " ").trim();
    recCleanup();
    rec.level = 0;
    if (!blob || blob.size < 1000) {
      rec.state = "idle"; rec.error = "التسجيل فارغ أو قصير جداً. حاولي مرة أخرى."; render(); return;
    }
    const metrics = await analyzeBlob(blob);
    if (metrics.duration < 1.5) {
      rec.state = "idle"; rec.error = "التسجيل قصير جداً — سجّلي تلاوتك كاملة ثم توقفي."; render(); return;
    }
    rec.result = { blob, mime: mime.split(";")[0], url: URL.createObjectURL(blob), metrics, transcript };
    rec.state = "idle";
    render();
  } catch (e) {
    recCleanup(); rec.state = "idle";
    rec.error = "حدث خطأ أثناء معالجة التسجيل. حاولي مرة أخرى.";
    render();
  }
}
function recReset() {
  if (rec.result) URL.revokeObjectURL(rec.result.url);
  rec.result = null; rec.error = null; rec.seconds = 0; rec.state = "idle";
  render();
}

  }, 5000);
  const audio = $("#ref-audio");
  if (audio) {
    audio.addEventListener("ended", updateRefBtn);
    audio.addEventListener("pause", updateRefBtn);
    audio.addEventListener("play", updateRefBtn);
  }
}
function updateRefBtn() {
  const audio = $("#ref-audio"), btn = $("#ref-play-btn");
  if (!audio || !btn) return;
  const playing = !audio.paused;
  btn.innerHTML = (playing ? icon("pause", 14) : icon("play", 14)) + " " + (playing ? "إيقاف" : "استمعي");
}

/* ============ results view ============ */
const BREAKDOWN_META = {
  accuracy: { label: "دقة القراءة", desc: "مطابقة الكلمات المنطوقة لنص السورة", color: "#1E4D3B" },
  completeness: { label: "الاكتمال", desc: "كم كلمة من السورة قرأتِ", color: "#2E6B54" },
  pacing: { label: "الإيقاع والسرعة", desc: "مقارنة سرعتك بالتلاوة المرجعية", color: "#C9A227" },
  steadiness: { label: "الثبات", desc: "استمرارية التلاوة دون فترات صمت", color: "#8A6D1A" }
};
function scoreRing(score, color, sublabel) {
  const size = 180, stroke = 14;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const filled = (clamp(score, 0, 100) / 100) * c;
  return (
    '<div class="ring-wrap" style="width:' + size + "px;height:" + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg)" role="img" aria-label="العلامة ' + score + ' من 100">' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#EDE6D4" stroke-width="' + stroke + '"/>' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + filled + " " + (c - filled) + '" style="transition:stroke-dasharray 1s ease-out"/>' +
      "</svg>" +
      '<div class="ring-center"><small>علامتك</small><span class="score" style="color:' + color + '">' + score + '</span><span class="of">من 100</span>' +
      (sublabel ? '<span class="sub" style="color:' + color + '">' + esc(sublabel) + "</span>" : "") +
      "</div></div>"
  );
}
function renderResults() {
  const r = app.result, s = app.surah;
  const ringColor = r.score >= 80 ? "#1E4D3B" : r.score >= 60 ? "#C9A227" : "#B3261E";
  const activeKeys = Object.keys(r.weights).filter((k) => r.weights[k] > 0);
  const breakdownHtml = activeKeys.map((k) => {
    const meta = BREAKDOWN_META[k];
    const v = r.breakdown[k];
    return (
      '<div class="bd-row">' +
        '<div class="bd-head"><span class="lbl">' + meta.label + ' <small>(وزن ' + r.weights[k] + ' نقطة)</small></span>' +
        '<span class="val" style="color:' + meta.color + '">' + Math.round(v) + "</span></div>" +
        '<div class="bd-track"><div class="bd-fill" style="width:' + v + "%;background-color:" + meta.color + '"></div></div>' +
        '<p class="bd-desc">' + meta.desc + "</p>" +
      "</div>"
    );
  }).join("");

  const notesHtml = r.notes.map((n) => {
    const ic = n.includes("ما شاء الله") || n.includes("أحسنت") || n.includes("استمري")
      ? icon("check", 16, "") .replace('stroke="currentColor"', 'stroke="#1E4D3B"')
      : n.includes("تعذّر") || n.includes("تأكدي")
        ? icon("info", 16).replace('stroke="currentColor"', 'stroke="#8A6D1A"')
        : icon("alert", 16).replace('stroke="currentColor"', 'stroke="#C9A227"');
    return "<li>" + ic + "<span>" + esc(n) + "</span></li>";
  }).join("");

  const textHtml = r.text.map((a) =>
    "<span>" +
      a.words.map((wd) => {
        const cls = wd.status === "correct" ? "w-correct" : wd.status === "sub" ? "w-sub" : "w-missing";
        const title = wd.spoken ? ' title="قرأتِ: ' + esc(wd.spoken) + '"' : "";
        return '<span class="' + cls + '"' + title + ">" + wd.w + "</span> ";
      }).join("") +
      '<span class="ayah-num" aria-label="آية ' + a.n + '">' + a.n + "</span> " +
    "</span>"
  ).join("");

  return (
    '<div class="container">' +
      '<section class="card" style="margin-top:1rem;padding:1.5rem">' +
        '<div class="score-head"><small>نتيجة تسميعك لسورة</small><h1 class="font-quran">سورة ' + esc(s.name.replace("سُورَةُ ", "")) + "</h1></div>" +
        '<div style="margin-top:1rem;display:flex;flex-direction:column;align-items:center;gap:.75rem">' +
          scoreRing(r.score, ringColor, r.grade) +
          '<span class="grade-pill" style="color:' + r.gradeColor + ";background:" + r.gradeBg + '">' + esc(r.grade) + "</span>" +
          (!r.asrUsed ? '<p class="asr-note">' + icon("info", 16) + " حُسبت العلامة هذه المرة من المؤشرات الصوتية فقط (تعذّر تحليل النص المنطوق)</p>" : "") +
        "</div>" +
      "</section>" +

      '<section class="card card-p" style="margin-top:1rem">' +
        '<h2 class="section-title" style="margin-bottom:1rem">تفصيل العلامة</h2>' +
        breakdownHtml +
      "</section>" +

      '<section class="card card-p" style="margin-top:1rem">' +
        '<h2 class="section-title" style="margin-bottom:.75rem">ملاحظات المقيّم</h2>' +
        '<ul class="notes-list">' + notesHtml + "</ul>" +
      "</section>" +

      '<section class="card card-p" style="margin-top:1rem">' +
        '<div style="margin-bottom:.75rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem">' +
          '<h2 class="section-title">نص السورة مع تلوين الأخطاء</h2>' +
          '<div class="legend"><span><span class="dot" style="background:#1E4D3B"></span> صحيحة</span><span><span class="dot" style="background:#B3261E"></span> خطأ أو ناقصة</span></div>' +
        "</div>" +
        '<div class="ayah-scroll" style="max-height:20rem"><p class="ayah-text font-quran" dir="rtl">' + textHtml + "</p></div>" +
        (r.extrasCount > 0 ? '<p class="extras-note">ملاحظة: وُجدت ' + r.extrasCount + " كلمة في التسجيل زائدة عن نص السورة.</p>" : "") +
      "</section>" +

      '<div class="results-actions">' +
        '<button class="btn btn-primary" data-action="retry">' + icon("rotate", 16) + " إعادة المحاولة</button>" +
        '<button class="btn" data-action="go-progress">' + icon("chart", 16) + " سجل التقدم</button>" +
        '<button class="btn" data-action="go-home">' + icon("home", 16) + " سورة أخرى</button>" +
      "</div>" +
    "</div>"
  );
}

/* ============ progress view ============ */
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("ar", { day: "numeric", month: "short" }) + " - " + d.toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
}
function lineChart(attempts) {
  const pts = attempts.slice(-30);
  if (pts.length === 0) return "";
  const W = 560, H = 180, P = { t: 12, r: 12, b: 24, l: 30 };
  const xs = (i) => P.l + (i / Math.max(1, pts.length - 1)) * (W - P.l - P.r);
  const ys = (v) => P.t + (1 - v / 100) * (H - P.t - P.b);
  const path = pts.map((a, i) => (i === 0 ? "M" : "L") + xs(i).toFixed(1) + "," + ys(a.score).toFixed(1)).join(" ");
  const area = path + " L" + xs(pts.length - 1).toFixed(1) + "," + (H - P.b) + " L" + xs(0).toFixed(1) + "," + (H - P.b) + " Z";
  const grid = [0, 50, 100].map((g) =>
    '<g><line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + ys(g) + '" y2="' + ys(g) + '" stroke="#EDE6D4" stroke-dasharray="4 4"/>' +
    '<text x="' + (P.l - 6) + '" y="' + (ys(g) + 4) + '" font-size="10" fill="#6E7B72" text-anchor="end">' + g + "</text></g>"
  ).join("");
  const dots = pts.map((a, i) =>
    '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(a.score).toFixed(1) + '" r="' + (a.score >= 90 ? 4.5 : 3) + '" fill="' +
    (a.score >= 90 ? "#1E4D3B" : a.score >= 60 ? "#C9A227" : "#B3261E") + '" stroke="#fff" stroke-width="1.5"><title>' + esc(a.grade) + " — " + a.score + "</title></circle>"
  ).join("");
  return (
    '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%" role="img" aria-label="رسم تطور العلامات">' +
      grid + '<path d="' + area + '" fill="#C9A227" opacity="0.12"/><path d="' + path + '" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>' + dots +
    "</svg>"
  );
}
function renderProgress() {
  const attempts = loadAttempts();
  const stats = overallStats(attempts);
  const badges = computeBadges(attempts);
  const profile = parseProfile(getProfileRaw());
  const surahName = (id) => {
    const s = SURAHS.find((x) => x.id === id);
    return s ? s.name.replace("سُورَةُ ", "") : "سورة " + id;
  };
  const sorted = attempts.slice().sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

  const profileBar = (profile.name || profile.classroom)
    ? '<div class="profile-bar">' +
        (profile.name ? "<span>" + icon("user", 16) + " الطالبة: <b>" + esc(profile.name) + "</b></span>" : "") +
        (profile.classroom ? "<span>" + icon("cap", 16) + " الصف والشعبة: <b>" + esc(profile.classroom) + "</b></span>" : "") +
      "</div>"
    : "";

  const statCards = [
    { label: "عدد المحاولات", value: stats.total, color: "#1E4D3B" },
    { label: "متوسط العلامات", value: stats.avg, color: "#C9A227" },
    { label: "سور متقنة (90+)", value: stats.mastered, color: "#2E6B54" },
    { label: "سور جرّبتِها", value: stats.surahsTried, color: "#8A6D1A" }
  ].map((c) => '<div class="stat-card"><p class="v" style="color:' + c.color + '">' + c.value + '</p><p class="l">' + c.label + "</p></div>").join("");

  const badgesHtml = badges.map((b) =>
    '<div class="badge-card' + (b.earned ? " earned" : "") + '"><span class="ic" aria-hidden="true">' + b.icon + "</span><p>" + esc(b.name) + "</p><small>" + esc(b.desc) + "</small></div>"
  ).join("");

  const clearBtn = attempts.length > 0
    ? (app.confirmClear
        ? '<div style="display:flex;align-items:center;gap:.5rem"><button class="btn btn-sm btn-destructive" data-action="clear-confirm">تأكيد الحذف</button><button class="btn btn-sm" data-action="clear-cancel">إلغاء</button></div>'
        : '<button class="btn btn-sm btn-ghost danger" data-action="clear-ask">' + icon("trash", 14) + " حذف السجل</button>")
    : "";

  const table = sorted.length === 0
    ? '<p class="chart-empty">لا توجد محاولات مسجلة بعد.</p>'
    : '<div class="table-wrap"><table><thead><tr>' +
        "<th>التاريخ</th><th>السورة</th><th>العلامة</th><th>التقدير</th></tr></thead><tbody>" +
        sorted.map((a) => {
          const color = a.score >= 90 ? "#1E4D3B" : a.score >= 60 ? "#8A6D1A" : "#B3261E";
          const bg = a.score >= 90 ? "#E2F0E8" : a.score >= 60 ? "#F5EBD0" : "#F9E3E1";
          return "<tr><td class=\"date\">" + fmtDate(a.date) + '</td><td class="font-quran">' + esc(surahName(a.surahId)) +
            '</td><td><span style="color:' + color + ";background:" + bg + '">' + a.score + "</span></td><td style=\"font-size:12px\">" + esc(a.grade) + "</td></tr>";
        }).join("") +
        "</tbody></table></div>";

  return (
    '<div class="container">' +
      '<div class="progress-head"><h1>سجل التقدم</h1><button class="btn btn-sm" data-action="go-home">' + icon("home", 16) + " الرئيسية</button></div>" +
      profileBar +
      '<div class="stats-grid">' + statCards + "</div>" +
      '<section class="card card-p" style="margin-top:1rem">' +
        '<h2 class="section-title" style="margin-bottom:.5rem">تطور علاماتك (آخر 30 محاولة)</h2>' +
        (attempts.length ? lineChart(attempts) : '<p class="chart-empty">لا توجد محاولات بعد — ابدئي بأول تسميع وسيظهر رسم التطور هنا.</p>') +
      "</section>" +
      '<section class="card card-p" style="margin-top:1rem">' +
        '<h2 class="section-title" style="margin-bottom:.75rem;display:flex;align-items:center;gap:.375rem">' + icon("trophy", 16) + " الشارات</h2>" +
        '<div class="badges-grid">' + badgesHtml + "</div>" +
      "</section>" +
      '<section class="card card-p" style="margin-top:1rem">' +
        '<div style="margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between">' +
          '<h2 class="section-title">كل المحاولات</h2>' + clearBtn +
        "</div>" + table +
      "</section>" +
    "</div>"
  );
}

/* ============ actions ============ */
async function submitTake() {
  if (!rec.result || app.submitting) return;
  app.submitting = true; app.submitError = null;
  render();
  try {
    await new Promise((r) => setTimeout(r, 60));
    const result = evaluate(app.surah, rec.result.metrics, rec.result.transcript || "");
    saveAttempt({
      surahId: app.surah.id, score: result.score, grade: result.grade,
      accuracy: result.breakdown.accuracy || null,
      completeness: result.breakdown.completeness,
      pacing: result.breakdown.pacing,
      steadiness: result.breakdown.steadiness,
      asrUsed: result.asrUsed
    });
    app.result = result; app.view = "results"; app.submitting = false;
    render();
  } catch (e) {
    app.submitting = false;
    app.submitError = "تعذّر تقييم التسجيل، حاولي مرة أخرى.";
    render();
  }
}
function navigate(view) {
  if (app.view === "recite" && rec.state === "recording") recStop();
  app.view = view; app.confirmClear = false;
  render();
}

/* ============ global event delegation ============ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action;
  if (act === "go-home") navigate("home");
  else if (act === "go-progress") navigate("progress");
  else if (act === "select-surah") {
    const s = SURAHS.find((x) => x.id === Number(el.dataset.id));
    if (s) { app.surah = s; app.result = null; app.view = "recite"; render(); micActivate(); }
  } else if (act === "rec-start") recStart();
  else if (act === "mic-activate") micActivate();
  else if (act === "open-standalone") openStandalone();
  else if (act === "rec-stop") recStop();
  else if (act === "rec-reset") recReset();
  else if (act === "submit-take") submitTake();
  else if (act === "retry") { app.result = null; app.view = "recite"; render(); micActivate(); }
  else if (act === "ref-play") {
    const audio = $("#ref-audio");
    if (audio) { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
  } else if (act === "ref-rate") {
    const audio = $("#ref-audio"), lbl = $("#rate-label");
    if (audio) {
      audio.playbackRate = audio.playbackRate === 1 ? 0.75 : 1;
      if (lbl) lbl.textContent = audio.playbackRate === 1 ? "السرعة ×1" : "السرعة ×0.75";
    }
  } else if (act === "clear-ask") { app.confirmClear = true; render(); }
  else if (act === "clear-cancel") { app.confirmClear = false; render(); }
  else if (act === "clear-confirm") { clearProgress(); app.confirmClear = false; render(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "surah-search") {
    app.q = t.value;
    // re-render only the grid to keep focus in the input
    const attempts = loadAttempts();
    const best = new Map();
    for (const a of attempts) { const cur = best.get(a.surahId); if (cur === undefined || a.score > cur) best.set(a.surahId, a.score); }
    const q = app.q.trim();
    let filtered = SURAHS;
    if (q) {
      const norm = normalizeArabic(q).replace(/^سورة\s*/, "");
      if (norm) filtered = SURAHS.filter((s) => {
        const n = normalizeArabic(s.name).replace(/^سورة\s*/, "");
        return n.includes(norm) || s.englishName.toLowerCase().includes(q.toLowerCase()) || String(s.id) === norm;
      });
    }
    const grid = $("#surah-grid");
    if (grid) {
      grid.innerHTML = filtered.map((s) => {
        const b = best.get(s.id);
        const mastered = (b || 0) >= 90;
        const pill = b !== undefined
          ? '<span class="score-pill ' + (mastered ? "mastered" : "tried") + '">' + (mastered ? "★ " : "") + "أفضل علامة: " + b + "</span>"
          : '<span class="score-pill new">لم تُسمّعي بعد</span>';
        return (
          '<button class="surah-card" data-action="select-surah" data-id="' + s.id + '" aria-label="سورة ' + esc(s.name) + " — " + s.ayahCount + ' آية">' +
            '<span class="star-badge"><span class="star-num">' + s.id + "</span></span>" +
            '<h3 class="font-quran">' + esc(s.name.replace("سُورَةُ ", "")) + "</h3>" +
            '<p class="surah-meta"><span>' + icon("list", 12) + " " + s.ayahCount + " آية</span><span>" + icon("clock", 12) + " " + fmtDur(s.duration) + "</span></p>" +
            pill +
          "</button>"
        );
      }).join("");
      let empty = $(".empty-note");
      if (filtered.length === 0 && !empty) grid.insertAdjacentHTML("afterend", '<p class="empty-note">لا توجد سورة بهذا الاسم — جرّبي اسماً آخر.</p>');
      else if (filtered.length > 0 && empty) empty.remove();
    }
  } else if (t.id === "profile-name") {
    const p = parseProfile(getProfileRaw()); p.name = t.value; saveProfile(p);
  } else if (t.id === "profile-class") {
    const p = parseProfile(getProfileRaw()); p.classroom = t.value; saveProfile(p);
  }
});
window.addEventListener("storage", (e) => { if (app.view === "home" || app.view === "progress") render(); });

/* ============ boot ============ */
function afterRender() {
  if (app.view === "recite") afterRenderRecite();
}
render();
micQuery();

</script>
